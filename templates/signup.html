<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Aarocare Connect</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            Aarocare Connect
        </div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('login') }}" class="nav-signup">
                Login
            </a>
        </div>

    </nav>


    <!-- Signup Form -->
    <div class="form-container">

        <h2>Create Your Account</h2>

        <p style="margin-bottom: 20px; color: #666;">
            Join Aarocare Connect and manage your healthcare appointments.
        </p>


        <form method="POST" action="{{ url_for('signup') }}">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                name="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>


        <p style="margin-top: 20px;">

            Already have an account?

            <a
                href="{{ url_for('login') }}"
                style="color: #1F4E78; font-weight: bold;"
            >
                Login
            </a>

        </p>

    </div>


    <!-- Footer -->
    <footer>

        <h3>Aarocare Connect</h3>

        <p>
            Making healthcare simpler and more accessible.
        </p>

    </footer>

</body>

</html>
