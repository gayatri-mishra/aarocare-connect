<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login | Aarocare Connect</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            Aarocare Connect
        </div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('signup') }}" class="nav-signup">Sign Up</a>
        </div>

    </nav>


    <!-- Login Form -->
    <div class="form-container">

        <h2>Welcome Back</h2>

        <p style="margin-bottom: 20px; color: #666;">
            Login to manage your healthcare appointments.
        </p>


        <form method="POST" action="{{ url_for('login') }}">

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <p style="margin-top: 20px;">

            Don't have an account?

            <a
                href="{{ url_for('signup') }}"
                style="color: #1F4E78; font-weight: bold;"
            >
                Sign Up
            </a>

        </p>

    </div>

</body>

</html>
